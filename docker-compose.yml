services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=sandboxes --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next: